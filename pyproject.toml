[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-pricer"
version = "0.1.0"
description = "Differentiable Monte Carlo option pricing on PyTorch"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",
    "numpy",
    "scipy",
    "QuantLib",
    "tqdm",
    "boto3",
    "pandas>=2.0",
    "pyarrow>=14",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["torch_pricer*", "data_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
